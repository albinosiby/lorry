org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# Pub packages are on C: while this checkout is on D:. Kotlin's incremental
# cache cannot relativize those paths on Windows.
kotlin.incremental=false
